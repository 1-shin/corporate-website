# Netlify 設定
# 静的ファイルのみを公開する（Tailwind の css/style.css はコミット済みのものを使う）
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 画像・動画は内容が変わらない前提で1年キャッシュする。
# 差し替えるときは必ずファイル名も変えること（同名で上書きすると
# 既存訪問者には最大1年間ふるい方が表示され続ける）。
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS はビルドのたびに同名で変わるためキャッシュを固定できない。
# 1日だけ保持し、その後は再検証させる。
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"
